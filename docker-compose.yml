name: workflow

x-app-env: &app-env
  APP_DEBUG: "false"

services:
  # PHP 服务 (TP8 需要 PHP 8.0+)
  php:
    build:
      context: .
      dockerfile: docker/php.Dockerfile
    image: ${PHP_IMAGE_NAME:-workflow-php:8.2-fpm}
    environment: *app-env
    volumes:
      - ./:/var/www/html
    networks:
      - workflow-network

  # Nginx 服务
  web:
    image: nginx:alpine
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - workflow-network

  # 后台工作流 Worker
  worker:
    image: ${PHP_IMAGE_NAME:-workflow-php:8.2-fpm}
    working_dir: /var/www/html
    command: php think workflow:worker --sleep=2 --stale-minutes=30
    environment: *app-env
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
      - redis
    networks:
      - workflow-network
    restart: unless-stopped

  # 剧集自动执行 Worker
  episode-worker:
    image: ${PHP_IMAGE_NAME:-workflow-php:8.2-fpm}
    working_dir: /var/www/html
    command: php think episode-workflow:worker --sleep=2 --stale-minutes=30
    environment: *app-env
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
      - redis
    networks:
      - workflow-network
    restart: unless-stopped

  # 剧集手动单节点 Worker
  episode-node-worker:
    image: ${PHP_IMAGE_NAME:-workflow-php:8.2-fpm}
    working_dir: /var/www/html
    command: php think episode-node:worker --sleep=2 --stale-minutes=15
    environment: *app-env
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
      - redis
    networks:
      - workflow-network
    restart: unless-stopped

  # 资产图片生成 Worker
  asset-worker:
    image: ${PHP_IMAGE_NAME:-workflow-php:8.2-fpm}
    working_dir: /var/www/html
    command: php think asset-image:worker --sleep=1 --cooldown=0 --max-concurrency=2 --stale-minutes=3 --wait-timeout-minutes=20 --poll-interval=3
    environment: *app-env
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
      - redis
    networks:
      - workflow-network
    restart: unless-stopped

  # 资产图片生成 Worker 副本 2
  asset-worker-2:
    image: ${PHP_IMAGE_NAME:-workflow-php:8.2-fpm}
    working_dir: /var/www/html
    command: php think asset-image:worker --sleep=1 --cooldown=0 --max-concurrency=2 --stale-minutes=3 --wait-timeout-minutes=20 --poll-interval=3
    environment: *app-env
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
      - redis
    networks:
      - workflow-network
    restart: unless-stopped

  # 资产图片生成 Worker 副本 3
  asset-worker-3:
    image: ${PHP_IMAGE_NAME:-workflow-php:8.2-fpm}
    working_dir: /var/www/html
    command: php think asset-image:worker --sleep=1 --cooldown=0 --max-concurrency=2 --stale-minutes=3 --wait-timeout-minutes=20 --poll-interval=3
    environment: *app-env
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
      - redis
    networks:
      - workflow-network
    restart: unless-stopped

  # Agent 任务状态机 Worker
  agent-worker:
    image: ${PHP_IMAGE_NAME:-workflow-php:8.2-fpm}
    working_dir: /var/www/html
    command: php think agent-task:worker --sleep=3
    environment: *app-env
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
      - redis
    networks:
      - workflow-network
    restart: unless-stopped

  # 视频生成 Worker（同步阻塞；每用户 2 路需多进程并行 claim）
  video-worker:
    image: ${PHP_IMAGE_NAME:-workflow-php:8.2-fpm}
    working_dir: /var/www/html
    command: php think video-job:worker --sleep=2 --cooldown=3 --per-user-concurrency=2 --max-global-concurrency=20 --stale-minutes=20
    environment: *app-env
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
      - redis
    networks:
      - workflow-network
    restart: unless-stopped

  video-worker-2:
    image: ${PHP_IMAGE_NAME:-workflow-php:8.2-fpm}
    working_dir: /var/www/html
    command: php think video-job:worker --sleep=2 --cooldown=3 --per-user-concurrency=2 --max-global-concurrency=20 --stale-minutes=20
    environment: *app-env
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
      - redis
    networks:
      - workflow-network
    restart: unless-stopped

  video-worker-3:
    image: ${PHP_IMAGE_NAME:-workflow-php:8.2-fpm}
    working_dir: /var/www/html
    command: php think video-job:worker --sleep=2 --cooldown=3 --per-user-concurrency=2 --max-global-concurrency=20 --stale-minutes=20
    environment: *app-env
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
      - redis
    networks:
      - workflow-network
    restart: unless-stopped

  video-worker-4:
    image: ${PHP_IMAGE_NAME:-workflow-php:8.2-fpm}
    working_dir: /var/www/html
    command: php think video-job:worker --sleep=2 --cooldown=3 --per-user-concurrency=2 --max-global-concurrency=20 --stale-minutes=20
    environment: *app-env
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
      - redis
    networks:
      - workflow-network
    restart: unless-stopped

  # 灵感速创（对话式快速生成）Worker
  quick-create-worker:
    image: ${PHP_IMAGE_NAME:-workflow-php:8.2-fpm}
    working_dir: /var/www/html
    command: php think quick-create:worker --sleep=2 --cooldown=3 --max-concurrency=2 --stale-minutes=20 --pending-timeout-minutes=20
    environment: *app-env
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
      - redis
    networks:
      - workflow-network
    restart: unless-stopped

  # AI 驱动剧本创作 Worker
  script-creation-worker:
    image: ${PHP_IMAGE_NAME:-workflow-php:8.2-fpm}
    working_dir: /var/www/html
    command: php think script-creation:worker --sleep=2 --stale-minutes=30
    environment: *app-env
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
      - redis
    networks:
      - workflow-network
    restart: unless-stopped

  # MySQL 服务
  db:
    image: mysql:8.0
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3308}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:?DB_PASS must be set}
      MYSQL_DATABASE: aimage
    volumes:
      - ./docker/mysql:/var/lib/mysql
    networks:
      - workflow-network

  # Redis 服务（短信验证码/JWT角色缓存）
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_FORWARD_PORT:-6380}:6379"
    networks:
      - workflow-network

networks:
  workflow-network:
    driver: bridge

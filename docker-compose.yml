name: workflow

x-app-env: &app-env
  APP_DEBUG: ${APP_DEBUG:-false}
  DB_TYPE: ${DB_TYPE:-mysql}
  DB_HOST: ${DB_HOST:-db}
  DB_NAME: ${DB_NAME:-aimage}
  DB_USER: ${DB_USER:-root}
  DB_PASS: ${DB_PASS:?DB_PASS must be set in .env}
  DB_PORT: "${DB_PORT:-3306}"
  REDIS_HOST: redis
  REDIS_PORT: "6379"

x-php-app: &php-app
  image: ${PHP_IMAGE_NAME:-workflow-php:8.2}
  env_file:
    - .env
  environment: *app-env
  working_dir: /var/www/html
  volumes:
    - runtime-data:/var/www/html/runtime
    - storage-data:/var/www/html/public/storage
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - workflow-network

x-worker: &worker
  <<: *php-app
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy

services:
  php:
    <<: *php-app
    build:
      context: .
      dockerfile: docker/php.Dockerfile
      target: runtime
    healthcheck:
      test: ["CMD", "php", "-r", "exit(extension_loaded('pdo_mysql') ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: docker/php.Dockerfile
      target: web
    image: ${WEB_IMAGE_NAME:-workflow-web:1.0}
    ports:
      - "${WEB_PORT:-8086}:80"
    volumes:
      - storage-data:/var/www/html/public/storage:ro
    depends_on:
      php:
        condition: service_healthy
    networks:
      - workflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/admin/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *worker
    command: ["php", "think", "workflow:worker", "--sleep=2", "--stale-minutes=30"]
  episode-worker:
    <<: *worker
    command: ["php", "think", "episode-workflow:worker", "--sleep=2", "--stale-minutes=30"]
  episode-node-worker:
    <<: *worker
    command: ["php", "think", "episode-node:worker", "--sleep=2", "--stale-minutes=15"]
  asset-worker:
    <<: *worker
    command: ["php", "think", "asset-image:worker", "--sleep=1", "--cooldown=0", "--max-concurrency=2", "--stale-minutes=3", "--wait-timeout-minutes=20", "--poll-interval=3"]
  asset-worker-2:
    <<: *worker
    command: ["php", "think", "asset-image:worker", "--sleep=1", "--cooldown=0", "--max-concurrency=2", "--stale-minutes=3", "--wait-timeout-minutes=20", "--poll-interval=3"]
  asset-worker-3:
    <<: *worker
    command: ["php", "think", "asset-image:worker", "--sleep=1", "--cooldown=0", "--max-concurrency=2", "--stale-minutes=3", "--wait-timeout-minutes=20", "--poll-interval=3"]
  agent-worker:
    <<: *worker
    command: ["php", "think", "agent-task:worker", "--sleep=3"]
  video-worker:
    <<: *worker
    command: ["php", "think", "video-job:worker", "--sleep=2", "--cooldown=3", "--per-user-concurrency=2", "--max-global-concurrency=20", "--stale-minutes=20"]
  video-worker-2:
    <<: *worker
    command: ["php", "think", "video-job:worker", "--sleep=2", "--cooldown=3", "--per-user-concurrency=2", "--max-global-concurrency=20", "--stale-minutes=20"]
  video-worker-3:
    <<: *worker
    command: ["php", "think", "video-job:worker", "--sleep=2", "--cooldown=3", "--per-user-concurrency=2", "--max-global-concurrency=20", "--stale-minutes=20"]
  video-worker-4:
    <<: *worker
    command: ["php", "think", "video-job:worker", "--sleep=2", "--cooldown=3", "--per-user-concurrency=2", "--max-global-concurrency=20", "--stale-minutes=20"]
  quick-create-worker:
    <<: *worker
    command: ["php", "think", "quick-create:worker", "--sleep=2", "--cooldown=3", "--max-concurrency=2", "--stale-minutes=20", "--pending-timeout-minutes=20"]
  script-creation-worker:
    <<: *worker
    command: ["php", "think", "script-creation:worker", "--sleep=2", "--stale-minutes=30"]

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:?DB_PASS must be set in .env}
      MYSQL_DATABASE: ${DB_NAME:-aimage}
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3308}:3306"
    volumes:
      - ${MYSQL_DATA_DIR:-./docker/mysql}:/var/lib/mysql
    networks:
      - workflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_FORWARD_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    networks:
      - workflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12

networks:
  workflow-network:
    driver: bridge
volumes:
  runtime-data:
  storage-data:
  redis-data:

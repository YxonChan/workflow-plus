server {
    listen 80;
    server_name localhost _;
    root /var/www/html/public;
    index index.php index.html;
    client_max_body_size 110m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/wasm
        image/svg+xml
        font/ttf
        font/otf
        application/font-woff
        application/font-woff2;

    # Hashed build files live under /admin/static/ (not /admin/assets/).
    # /admin/assets is the Vue SPA route for 资产管理; do not map it to a real directory.
    location /admin/static/ {
        alias /var/www/html/public/admin/static/;
        try_files $uri @admin_static_missing;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location @admin_static_missing {
        add_header Cache-Control "no-store" always;
        return 404;
    }

    # Legacy bookmark /admin/assets/ must hit the SPA, not a static-dir fallback.
    location = /admin/assets/ {
        return 301 /admin/assets;
    }

    # Keep the SPA shell fresh so it can point at the latest hashed assets.
    location = /admin/index.html {
        alias /var/www/html/public/admin/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # Vue SPA: all /admin/* requests fall back to index.html.
    location /admin/ {
        alias /var/www/html/public/admin/;
        try_files $uri /admin/index.html;
        add_header Cache-Control "no-cache" always;
    }

    # PHP / TP8 (API routes, old page redirects, etc.)
    location / {
        if (!-e $request_filename) {
            rewrite ^/(.*)$ /index.php?s=/$1 last;
        }
    }

    location ~ \.php($|/) {
        fastcgi_pass   php:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout    600s;
        fastcgi_read_timeout    600s;
        include        fastcgi_params;
    }

    location ~ /\. {
        deny all;
    }
}

